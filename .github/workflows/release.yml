name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.10'
      - run: uv sync --frozen --python 3.13
      - name: Match tag to package version
        run: uv run --frozen python -c "import os; from font_design_mcp import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - run: uv build
      - run: uv run --frozen python scripts/check_distribution.py
      - run: uv run --frozen python scripts/test_wheel.py
      - name: Publish wheel and sdist using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
      - run: uv run --frozen python scripts/build_mcpb.py
      - name: Checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --verify-tag --generate-notes
