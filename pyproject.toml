[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "font-design-mcp"
version = "0.2.0"
description = "Local deterministic UFO font editing over MCP STDIO"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp==2.2.0",
  "pydantic==2.13.5",
  "ufoLib2==0.18.1",
  "fonttools[woff]==4.64.0",
  "fontmake==3.12.1",
  "uharfbuzz==0.56.1",
  "freetype-py==2.5.1",
  "Pillow==12.3.0",
  "filelock==3.32.5",
  "defusedxml==0.7.1",
  "booleanOperations==0.10.0",
]

[project.scripts]
font-design-mcp = "font_design_mcp.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/docs", "/mcpb", "/server.json", "/pyproject.toml", "/uv.lock", "/requirements.lock", "/README.md", "/README.fr.md", "/LICENSE", "/.github"]
